<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0870d3"><meta name="description" content="Slaid untuk memilih teman misi SKUAD S.A.F.E. — sahabat aktif, faham dan empati.">
<title>Pilih Karakter • SKUAD S.A.F.E.</title>
<style>
:root{font-family:ui-rounded,"Trebuchet MS",Arial,sans-serif;color:#10355c;--accent:#168cfa}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,.viewport:focus-visible{outline:3px solid #ffcf48;outline-offset:3px}.backdrop{position:fixed;inset:0;z-index:-3;pointer-events:none}.backdrop img{width:100%;height:100%;object-fit:cover}.wash{position:fixed;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(180deg,transparent 10%,#e9faff30 40%,#074b8d38 75%,#052d648c)}.particles{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}.particles i{position:absolute;left:var(--x);top:var(--y);height:3px;width:3px;background:white;border-radius:50%;box-shadow:0 0 12px 3px #96e6ff;animation:drift var(--time,7s) ease-in-out infinite alternate}@keyframes drift{to{transform:translate(12px,-30px);opacity:.2}}
.app{width:100%;max-width:1100px;height:100vh;height:100dvh;margin:auto;padding:12px 30px max(10px,env(safe-area-inset-bottom));display:grid;grid-template-rows:clamp(58px,15dvh,145px) 40px minmax(0,1fr) auto 18px;gap:5px;overflow:hidden}.top{min-height:0}.intro{text-align:center;align-self:center}.intro h1{margin:0;color:white;font-size:clamp(22px,3vw,34px);line-height:1.1;text-shadow:0 2px 0 #2165ad,0 5px 16px #00376580}
.selector{width:min(560px,100%);height:100%;min-height:0;justify-self:center;position:relative;display:grid;grid-template-rows:minmax(0,1fr) 32px}.viewport{min-height:0;height:100%;width:100%;overflow:hidden;position:relative;touch-action:pan-y;cursor:grab;border-radius:28px;isolation:isolate}.viewport.dragging{cursor:grabbing}.track{height:100%;display:flex;transition:transform .5s cubic-bezier(.22,.8,.25,1);will-change:transform}.dragging .track{transition:none}.slide{flex:0 0 100%;min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) 46px;padding:8px 36px 0;gap:2px;--color:#168cfa}.art{min-height:0;position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center}.art:before{content:"";position:absolute;inset:12% 10%;border-radius:50%;background:radial-gradient(ellipse,#ffffff8a,var(--color) 30%,transparent 68%);filter:blur(30px);opacity:.38;z-index:-1;animation:aura 4s ease-in-out infinite alternate}.art img{display:block;width:100%;height:100%;max-width:100%;min-height:0;object-fit:contain;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 10px 10px #173d6245);opacity:.3;transform:scale(.9);transition:opacity .4s,transform .5s}.active .art img{opacity:1;transform:scale(1);animation:float 4s ease-in-out .5s infinite}.bio{display:flex;justify-content:center;align-items:center}.bio h2{margin:0;min-width:132px;padding:6px 30px;font-size:26px;line-height:1.1;letter-spacing:.01em;text-align:center;background:linear-gradient(120deg,#ffffffd9,#d8f0ffa8,#ffffffd9);border:1px solid #fff;border-radius:99px;backdrop-filter:blur(15px);box-shadow:0 4px 20px #12569c24;color:#173f69}.active .bio h2{box-shadow:0 4px 20px #12569c24,0 0 18px color-mix(in srgb,var(--color) 45%,transparent)}
@keyframes float{50%{transform:translateY(-5px) scale(.985)}}@keyframes aura{to{opacity:.6;transform:scale(1.06)}}.nav{position:absolute;top:45%;z-index:2;width:44px;height:44px;border-radius:50%;border:1px solid #ffffffdc;background:#ffffffbb;backdrop-filter:blur(12px);box-shadow:0 6px 24px #0a3f8033;color:#0c518f;font-size:29px;display:grid;place-items:center;transition:transform .2s,opacity .2s}.nav:hover:not(:disabled){transform:scale(1.08)}.nav:disabled{opacity:.22;cursor:default}.prev{left:0}.next{right:0}.slider-footer{display:flex;justify-content:center;align-items:center;gap:8px;min-height:0}.dots{display:flex;gap:3px}.dot{width:28px;height:28px;border:0;background:none;padding:8px;display:grid;place-items:center}.dot:before{content:"";width:6px;height:6px;border-radius:99px;background:#ffffff9c;box-shadow:0 1px 5px #23538577;transition:width .25s}.dot[aria-current="true"]:before{width:20px;background:#ffe078}.hint{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.form{width:min(540px,100%);justify-self:center;padding:10px 12px;border:1px solid #ffffffd9;border-radius:18px;display:flex;gap:10px;align-items:end;background:linear-gradient(125deg,#ffffffd1,#dcf0ffb5);backdrop-filter:blur(18px);box-shadow:0 8px 30px #073c7c20}.form label{flex:1;min-width:0;font-size:11px;font-weight:900}.form input{display:block;margin-top:4px;width:100%;min-width:0;border:1px solid #add5ef;padding:9px 10px;border-radius:10px;background:#ffffffe6;color:#173f66;font-size:16px;outline:0}.form input:focus{border-color:#219bf6;box-shadow:0 0 0 2px #57beff30}.cta{border:0;border-radius:11px;padding:11px 17px;color:#113963;font-size:13px;font-weight:900;white-space:nowrap;background:linear-gradient(135deg,#ffe775,#ffbd30);box-shadow:0 3px 0 #c08319;transition:transform .2s;min-height:40px}.cta:hover{transform:translateY(-1px)}.feedback{font-size:11px;color:white;line-height:16px;min-height:0;text-align:center;margin:0;text-shadow:0 1px 5px #164785;font-weight:800;overflow:hidden}
.modal{position:fixed;inset:0;z-index:20;padding:16px;display:grid;place-items:center;background:#052044ad;backdrop-filter:blur(12px)}.modal[hidden]{display:none}.dialog{position:relative;max-width:420px;width:100%;max-height:calc(100dvh - 32px);padding:22px;border:1px solid white;border-radius:25px;background:linear-gradient(130deg,#fffffff5,#d5effff2);text-align:center;box-shadow:0 22px 90px #00214a66;overflow:auto;animation:appear .3s ease-out}.dialog img{width:100%;height:min(24dvh,190px);object-fit:contain}.dialog h2{font-size:23px;margin:8px 0}.dialog p{font-size:13px;line-height:1.5}.close{position:absolute;right:10px;top:10px;width:36px;height:36px;border:0;border-radius:50%;background:white;color:#245986;font-size:23px}@keyframes appear{from{opacity:0;transform:translateY(15px) scale(.97)}}
@media(min-width:601px) and (orientation:portrait){.app{grid-template-rows:clamp(85px,18dvh,200px) 42px minmax(0,1fr) auto 18px;padding-bottom:25px}.selector{width:min(580px,88%)}.slide{padding-top:12px;padding-bottom:4px}}
@media(max-width:600px){.app{padding:8px 16px max(8px,env(safe-area-inset-bottom));grid-template-rows:clamp(85px,22dvh,200px) 32px minmax(0,1fr) auto 16px;gap:3px}.intro h1{font-size:23px}.selector{width:100%;grid-template-rows:minmax(0,1fr) 28px}.slide{padding:6px 26px 0;grid-template-rows:minmax(0,1fr) 40px}.bio h2{font-size:23px;min-width:112px;padding:5px 24px}.nav{width:38px;height:44px;font-size:25px}.prev{left:-3px}.next{right:-3px}.form{padding:8px;gap:8px;border-radius:15px}.form label{font-size:10px}.form input{font-size:16px;padding:8px}.cta{font-size:12px;padding:10px 12px}.feedback{font-size:10px}}
@media(max-height:550px) and (orientation:landscape){.app{padding-top:6px;padding-bottom:6px;grid-template-rows:18px 28px minmax(0,1fr) auto 14px;gap:2px}.intro h1{font-size:22px}.selector{width:min(480px,70%);grid-template-rows:minmax(0,1fr) 23px}.slide{grid-template-rows:minmax(0,1fr) 30px;padding-top:2px}.bio h2{font-size:19px;padding:3px 22px;min-width:100px}.form{padding:5px 9px;width:min(480px,80%)}.form label{font-size:9px}.form input{padding:6px 9px;margin-top:2px}.cta{padding:7px 14px;min-height:34px}.dot{height:23px}.feedback{font-size:9px;line-height:13px}}
@media(max-height:480px) and (orientation:portrait){.app{grid-template-rows:30px 26px minmax(0,1fr) auto 14px}.form{padding:5px}.form label{font-size:9px}.form input{padding:5px}.cta{padding:8px}.intro h1{font-size:20px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:.01ms!important}.active .art img{transform:scale(1)}}
</style>
<link rel="stylesheet" href="world.css">
</head>
<body>
<picture class="backdrop"><source media="(max-width:600px)" srcset="assets/bg-mobile.webp"><source media="(max-width:1100px)" srcset="assets/bg-tablet.webp"><img src="assets/bg-desktop.webp" alt=""></picture><div class="wash" aria-hidden="true"></div>
<div class="particles" aria-hidden="true"><i style="--x:15%;--y:30%"></i><i style="--x:28%;--y:67%;--time:9s"></i><i style="--x:78%;--y:42%;--time:8s"></i><i style="--x:87%;--y:73%"></i><i style="--x:45%;--y:20%;--time:10s"></i><i style="--x:63%;--y:86%"></i></div>
<main class="app">
<header class="top" aria-hidden="true"></header>
<section class="intro"><h1>Pilih watak kamu</h1></section>
<section class="selector" aria-label="Pemilihan karakter" aria-roledescription="karusel">
<button class="nav prev" id="prev" aria-label="Karakter sebelumnya" aria-controls="track">‹</button>
<div class="viewport" id="viewport" tabindex="0" aria-label="Slaid karakter. Gunakan kekunci anak panah kiri dan kanan."><div class="track" id="track"></div></div>
<button class="nav next" id="next" aria-label="Karakter seterusnya" aria-controls="track">›</button>
<div class="slider-footer"><div class="dots" id="dots" aria-label="Pilih slaid"></div><p class="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M8 4 3 9l5 5M3 9h18M16 10l5 5-5 5M21 15H3"/></svg><span id="slide-label" role="status" aria-live="polite"></span></p></div>
</section>
<form class="form" id="form"><label for="name">Nama penuh kamu<input id="name" name="name" maxlength="60" autocomplete="name" placeholder="Tulis nama penuh kamu" required></label><button class="cta" id="choose" type="submit">Pilih ALFA →</button></form>
<p class="feedback" id="feedback" role="status" aria-live="polite"></p>
</main>
<script src="js/nexus-engine.js"></script>
<script src="js/hand-controller.js"></script>
<script src="js/safe-world.js"></script>
<script>
const people=[
{id:'arif',name:'ALFA',role:'Ketua Skuad',desc:'Berani membuat pilihan yang selamat dan mengajak rakan bertindak bersama.',power:'Kepimpinan berhemah',color:'#168cfa'},
{id:'airis',name:'NOVA',role:'Pakar Komunikasi',desc:'Bijak menggunakan kata-kata yang baik untuk meredakan keadaan dan mendapatkan bantuan.',power:'Kata-kata positif',color:'#e8ad16'},
{id:'faris',name:'BYTE',role:'Pakar Digital',desc:'Peka terhadap buli siber dan tahu cara melindungi diri serta rakan di ruang digital.',power:'Keselamatan digital',color:'#ed605b'},
{id:'sara',name:'AURA',role:'Pakar Sokongan',desc:'Mendengar dengan empati dan menemani rakan untuk mendapatkan sokongan orang dewasa.',power:'Empati dan sokongan',color:'#9b6be8'}];
const $=s=>document.querySelector(s);
const storage={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
let index=Math.max(0,people.findIndex(p=>p.id===storage.get('safe-character')));
$('#name').value=storage.get('safe-name')||'';
$('#track').innerHTML=people.map((p,i)=>`<article class="slide" style="--color:${p.color}" aria-roledescription="slaid" aria-label="${i+1} daripada 4: ${p.name}"><div class="art"><img src="assets/${p.id}-action.png" alt="${p.name}" draggable="false"></div><div class="bio"><h2>${p.name}</h2></div></article>`).join('');
$('#dots').innerHTML=people.map((p,i)=>`<button class="dot" type="button" data-index="${i}" aria-label="Lihat ${p.name}" aria-controls="track"></button>`).join('');
const slides=[...document.querySelectorAll('.slide')],dots=[...document.querySelectorAll('.dot')];
function position(offset=0){$('#track').style.transform=`translate3d(calc(-${index*100}% + ${offset}px),0,0)`}
function select(next){index=Math.max(0,Math.min(people.length-1,next));const p=people[index];position();slides.forEach((slide,i)=>{slide.classList.toggle('active',i===index);slide.setAttribute('aria-hidden',String(i!==index));slide.inert=i!==index});dots.forEach((dot,i)=>dot.setAttribute('aria-current',String(i===index)));$('#prev').disabled=index===0;$('#next').disabled=index===people.length-1;$('#slide-label').textContent=`0${index+1} / 04 · ${p.name}`;$('#choose').textContent=`Pilih ${p.name} →`;$('.selector').style.setProperty('--accent',p.color);storage.set('safe-character',p.id)}
$('#prev').addEventListener('click',()=>select(index-1));$('#next').addEventListener('click',()=>select(index+1));dots.forEach(dot=>dot.addEventListener('click',()=>select(Number(dot.dataset.index))));
const viewport=$('#viewport');
viewport.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();select(index+(e.key==='ArrowRight'?1:-1))}else if(e.key==='Home'){e.preventDefault();select(0)}else if(e.key==='End'){e.preventDefault();select(people.length-1)}});
let gesture=null;
viewport.addEventListener('pointerdown',e=>{if(!e.isPrimary||(e.pointerType==='mouse'&&e.button!==0))return;gesture={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,mode:null};viewport.setPointerCapture(e.pointerId)});
viewport.addEventListener('pointermove',e=>{if(!gesture||e.pointerId!==gesture.id)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(!gesture.mode&&Math.max(Math.abs(dx),Math.abs(dy))>8)gesture.mode=Math.abs(dx)>Math.abs(dy)?'horizontal':'vertical';if(gesture.mode!=='horizontal')return;gesture.dx=dx;viewport.classList.add('dragging');const edge=(index===0&&dx>0)||(index===people.length-1&&dx<0);position(edge?dx*.22:dx)});
function finishGesture(e,cancelled=false){if(!gesture||e.pointerId!==gesture.id)return;const g=gesture;gesture=null;viewport.classList.remove('dragging');const threshold=Math.min(75,viewport.clientWidth*.15);if(!cancelled&&g.mode==='horizontal'&&Math.abs(g.dx)>threshold)select(index+(g.dx<0?1:-1));else position();if(viewport.hasPointerCapture(e.pointerId))viewport.releasePointerCapture(e.pointerId)}
viewport.addEventListener('pointerup',e=>finishGesture(e));viewport.addEventListener('pointercancel',e=>finishGesture(e,true));viewport.addEventListener('lostpointercapture',e=>finishGesture(e,true));
let wheelLocked=false;viewport.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)<Math.abs(e.deltaY)||Math.abs(e.deltaX)<12)return;e.preventDefault();if(wheelLocked)return;wheelLocked=true;select(index+(e.deltaX>0?1:-1));setTimeout(()=>wheelLocked=false,650)},{passive:false});
select(index);
$('#form').addEventListener('submit',e=>{
 e.preventDefault();const name=$('#name').value.trim().replace(/\s+/g,' ');
 if(name.length<2){$('#feedback').textContent='Sila tulis nama kamu terlebih dahulu.';$('#name').focus();return}
 let playerId=storage.get('safe-player-id');
 if(!playerId||storage.get('safe-name')!==name){playerId=globalThis.crypto?.randomUUID?.()||('player-'+Date.now()+'-'+Math.random().toString(36).slice(2));storage.set('safe-player-id',playerId)}
 storage.set('safe-name',name);$('#feedback').textContent='';
 SafeWorld.open({id:playerId,name,avatar:people[index].id,classroom:storage.get('safe-class')||''});
});
</script>
</body></html>
